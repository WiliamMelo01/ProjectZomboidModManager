name: Build Linux Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux app and helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: npm run build

      - name: Build Linux helper
        working-directory: src-tauri
        run: cargo build --release --bin pzmm-helper-linux-x86_64

      - name: Build Linux app executable
        working-directory: src-tauri
        run: cargo build --release --bin zomboid_server_mod_manager

      - name: Stage Linux assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/pzmm-helper-linux-x86_64 release-assets/pzmm-helper-linux-x86_64
          cp src-tauri/target/release/zomboid_server_mod_manager release-assets/pz-manager-linux-x86_64
          chmod 0755 release-assets/pzmm-helper-linux-x86_64 release-assets/pz-manager-linux-x86_64

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pzmm-linux-release-assets
          path: release-assets/*

      - name: Upload Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
