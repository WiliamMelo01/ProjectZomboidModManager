name: Build Windows Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows app
        run: node ./scripts/run-tauri-command.mjs build

      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/zomboid_server_mod_manager.exe release-assets/pz-manager-windows-x86_64.exe
          $bundlePath = "src-tauri/target/release/bundle"
          if (Test-Path -LiteralPath $bundlePath) {
            Get-ChildItem -LiteralPath $bundlePath -Recurse -File |
              Where-Object { $_.Extension -in ".msi", ".exe" } |
              ForEach-Object { Copy-Item $_.FullName (Join-Path release-assets $_.Name) -Force }
          }

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pzmm-windows-release-assets
          path: release-assets/*

      - name: Upload Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
